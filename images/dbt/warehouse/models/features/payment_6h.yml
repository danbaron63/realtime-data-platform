version: 2

models:
  - name: payment_6h
    description: "Authorised payments 6h features"
    columns:
      - name: window_end
        data_tests:
          - not_null
      - name: window_start
        data_tests:
          - unique
      - name: account_id
        data_tests:
          - not_null
      - name: card_id
        data_tests:
          - not_null
      - name: tx_count
        data_tests:
          - not_null
      - name: total_amount
