apiVersion: batch/v1
kind: CronJob
metadata:
  name: pinot-load
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: extract
              image: pinot-load:latest
              imagePullPolicy: Never
              resources:
                requests:
                  cpu: "1000m"
                  memory: "256Mi"
              args:
                - /app/extract.py
                - payment_6h_inference
              env:
                - name: KAFKA_BROKER
                  value: "redpanda-0.redpanda.default.svc.cluster.local:9093"
                - name: SCHEMA_REGISTRY_URL
                  value: "http://redpanda-0.redpanda.default.svc.cluster.local:8081"
          initContainers:
            - name: wait-for-trino
              image: curlimages/curl:8.16.0
              resources:
                requests:
                  cpu: 1m
                  memory: 8Mi
                limits:
                  cpu: 10m
                  memory: 16Mi
              env:
                - name: HEALTH_URL
                  value: http://trino:8080/v1/status
              command:
                - sh
                - -c
                - |
                  until curl -fsS "$HEALTH_URL"; do
                    sleep 5
                  done
            - name: wait-for-schema-registry
              image: curlimages/curl:8.16.0
              resources:
                requests:
                  cpu: 1m
                  memory: 8Mi
                limits:
                  cpu: 10m
                  memory: 16Mi
              env:
                - name: HEALTH_URL
                  value: http://redpanda:8081/subjects
              command:
                - sh
                - -c
                - |
                  until curl -fsS "$HEALTH_URL" >/dev/null; do
                    sleep 5
                  done
          restartPolicy: OnFailure