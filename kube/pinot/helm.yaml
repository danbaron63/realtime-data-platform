apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pinot-broker
  namespace: default
  labels:
    helm.sh/chart: pinot-1.0.0
    app: pinot
    release: pinot
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    heritage: Helm
    component: broker
spec:
  selector:
    matchLabels:
      app: pinot
      release: pinot
      component: broker
  serviceName: pinot-broker-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        helm.sh/chart: pinot-1.0.0
        app: pinot
        release: pinot
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
        heritage: Helm
        component: broker
      annotations:
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: pinot
      securityContext:
        {}
      nodeSelector:
        {}
      affinity:
        {}
      tolerations:
        []
      initContainers:
        []
      containers:
      - name: broker
        securityContext:
          {}
        image: "apachepinot/pinot:1.5.1"
        imagePullPolicy: Always
        args: [
          "StartBroker",
          "-clusterName", "pinot-quickstart",
          "-zkAddress", "pinot-zookeeper:2181",
          "-configFileName", "/var/pinot/broker/config/pinot-broker.conf"
        ]
        env:
          - name: JAVA_OPTS
            value: "-Xms512M -Xmx768M -Dlog4j2.configurationFile=/opt/pinot/etc/conf/pinot-broker-log4j2.xml -Dplugins.dir=/opt/pinot/plugins"
          - name: LOG4J_CONSOLE_LEVEL
            value: info
        envFrom:
          []
        ports:
          - containerPort: 8099
            protocol: TCP
            name: broker                  
        volumeMounts:
          - name: config
            mountPath: /var/pinot/broker/config
        livenessProbe:
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 15
          successThreshold: 1
          timeoutSeconds: 10
          httpGet:
            path: /health
            port: 8099
        readinessProbe:
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 15
          successThreshold: 1
          timeoutSeconds: 10
          httpGet:
            path: /health
            port: 8099
        resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: pinot-broker-config

