    release: pinot
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    heritage: Helm
    component: server
spec:
  selector:
    matchLabels:
      app: pinot
      release: pinot
      component: server
  serviceName: pinot-server-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        helm.sh/chart: pinot-1.0.0
        app: pinot
        release: pinot
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
        heritage: Helm
        component: server
      annotations:
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: pinot
      securityContext:
        {}
      nodeSelector:
        {}
      affinity:
        {}
      tolerations:
        []
      initContainers:
        []
      containers:
      - name: server
        securityContext:
          {}
        image: "apachepinot/pinot:1.5.1"
        imagePullPolicy: Always
        args: [
          "StartServer",
          "-clusterName", "pinot-quickstart",
          "-zkAddress", "pinot-zookeeper:2181",
          "-configFileName", "/var/pinot/server/config/pinot-server.conf"
        ]
        env:
          - name: JAVA_OPTS
            value: "-Xms512M -Xmx768M -Dlog4j2.configurationFile=/opt/pinot/etc/conf/pinot-server-log4j2.xml -Dplugins.dir=/opt/pinot/plugins"
          - name: LOG4J_CONSOLE_LEVEL
            value: info
        envFrom:
          []
        ports:
          - containerPort: 8098
            protocol: TCP
            name: netty
          - containerPort: 8097
            protocol: TCP
            name: admin
        volumeMounts:
          - name: config
            mountPath: /var/pinot/server/config
          - name: data
            mountPath: "/var/pinot/server/data"
        resources:
            limits:
              cpu: 250m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
      restartPolicy: Always
      volumes:
        - name: config
          configMap:
            name: pinot-server-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: 4Gi
  

