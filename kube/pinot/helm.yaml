apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pinot-zookeeper
  namespace: default
  labels:
    helm.sh/chart: pinot-1.0.0
    app: pinot
    release: pinot
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    heritage: Helm
    component: zookeeper
spec:
  selector:
    matchLabels:
      app: pinot
      release: pinot
      component: zookeeper
  serviceName: pinot-zookeeper-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        helm.sh/chart: pinot-1.0.0
        app: pinot
        release: pinot
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
        heritage: Helm
        component: zookeeper
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: pinot
      containers:
      - name: zookeeper
        image: "zookeeper:3.9.3"
        imagePullPolicy: IfNotPresent
        env:
          - name: ZOO_SERVERS
            value: "server.1=pinot-zookeeper-0.pinot-zookeeper-headless.default:2888:3888;2181"
          - name: ZOO_TICK_TIME
            value: "2000"
          - name: ZOO_INIT_LIMIT
            value: "10"
          - name: ZOO_SYNC_LIMIT
            value: "5"
          - name: ZOO_MAX_CLIENT_CNXNS
            value: "60"
          - name: ZOO_AUTOPURGE_PURGE_INTERVAL
            value: "1"
          - name: ZOO_AUTOPURGE_SNAP_RETAIN_COUNT
            value: "5"
          - name: JVMFLAGS
            value: "-Xmx1024m -Xms1024m -Djute.maxbuffer=4000000"
          - name: ZOO_4LW_COMMANDS_WHITELIST
            value: "srvr,mntr,ruok,conf"
          - name: ZOO_ADMINSERVER_ENABLED
            value: "false"
        command:
          - bash
          - -c
          - |
            # The official ZooKeeper image uses 1-based IDs, but pod-index is 0-based
            HOST=$(hostname -s)
            if [[ $HOST =~ (.*)-([0-9]+)$ ]]; then
              export ZOO_MY_ID=$(( ${BASH_REMATCH[2]} + 1 ))
            else
              echo "Failed to extract ordinal from hostname $HOST"
              exit 1
            fi
            exec /docker-entrypoint.sh zkServer.sh start-foreground
        ports:
          - name: client
            containerPort: 2181
          - name: follower
            containerPort: 2888
          - name: election
            containerPort: 3888
        livenessProbe:
          exec:
            command:
              - bash
              - -c
              - echo ruok | nc -w 5 localhost 2181 | grep imok
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
              - bash
              - -c
              - echo ruok | nc -w 5 localhost 2181 | grep imok
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
          - name: data
            mountPath: /data
          - name: datalog
            mountPath: /datalog
        resources:
          limits:
            cpu: 100m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "8Gi"
    - metadata:
        name: datalog
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "8Gi"

